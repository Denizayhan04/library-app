<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kitaplarım')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">

    <div class="page-header">
        <h1>📚 Kitaplarım</h1>
        <p class="text-muted">Ödünç aldığınız kitapların geçmişi ve durumları</p>
    </div>

    <!-- Başarı/Hata Mesajları -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="table-card">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Kitap Adı</th>
                    <th>Yazar</th>
                    <th>Ödünç Alma Tarihi</th>
                    <th>İade Tarihi</th>
                    <th>Durum</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="log : ${borrowLogs}">
                    <td>
                        <a th:href="@{/books/{id}(id=${log.book.id})}" th:text="${log.book.title}">Kitap</a>
                    </td>
                    <td th:text="${log.book.author}">Yazar</td>
                    <td th:text="${#temporals.format(log.borrowDate, 'dd-MM-yyyy HH:mm')}">Tarih</td>
                    <td th:text="${log.returnDate != null ? #temporals.format(log.returnDate, 'dd-MM-yyyy HH:mm') : '-'}">-</td>
                    <td>
                        <span class="badge" 
                              th:classappend="${log.status == 'RETURNED'} ? 'badge-success' : 'badge-warning'" 
                              th:text="${log.status == 'RETURNED'} ? 'İade Edildi' : 'Sizde'">Sizde</span>
                    </td>
                    <td>
                        <form th:if="${log.status != 'RETURNED'}" 
                              th:action="@{/my-books/return/{id}(id=${log.id})}" 
                              method="post"
                              onsubmit="return confirm('Bu kitabı iade etmek istediğinizden emin misiniz?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-primary">İade Et</button>
                        </form>
                        <span th:if="${log.status == 'RETURNED'}" class="text-muted">Tamamlandı</span>
                    </td>
                </tr>
                <tr th:if="${borrowLogs.empty}">
                    <td colspan="6" style="text-align:center; padding: 2rem;">
                        Henüz hiç kitap ödünç almadınız. <a href="/books">Kitaplara göz atın!</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
