<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giriş')}"></head>
<body class="auth-page">

<main class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>📚 KütüphaneApp</h1>
            <p>Hesabınıza giriş yapın</p>
        </div>

        <!-- Hata mesajı -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <!-- Çıkış mesajı -->
        <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>

        <form action="/login" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" name="username"
                       class="form-control" placeholder="Kullanıcı adınızı girin" required autofocus/>
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password"
                       class="form-control" placeholder="Şifrenizi girin" required/>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Giriş Yap</button>
        </form>

        <div class="auth-hint">
            <p><strong>Test Hesapları:</strong></p>
            <p>👤 Normal kullanıcı: <code>user / user123</code></p>
            <p>⚙ Yönetici: <code>admin / admin123</code></p>
        </div>

        <div class="auth-footer">
            <a href="/books">← Giriş yapmadan devam et</a>
        </div>
    </div>
</main>

</body>
</html>
